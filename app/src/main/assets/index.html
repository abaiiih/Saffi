<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشتي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07080B;overflow:hidden;cursor:none}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#F5F6F8}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;overflow:hidden;background:#07080B}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1);transition:opacity 1.6s ease,transform 7s linear}
.sl.on{opacity:1;transform:scale(1.07)}
.sl svg,.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade1{position:absolute;inset:0;background:linear-gradient(0deg,#07080B 0%,rgba(7,8,11,.92) 24%,rgba(7,8,11,.25) 58%,rgba(7,8,11,.45) 100%)}
.shade2{position:absolute;inset:0;background:linear-gradient(270deg,rgba(7,8,11,.85) 0%,rgba(7,8,11,.3) 45%,rgba(7,8,11,0) 70%)}
#dim{position:absolute;inset:0;background:rgba(7,8,11,.86);opacity:0;transition:opacity .5s ease;pointer-events:none}
.sub #dim{opacity:1}
header{position:absolute;top:30px;right:56px;left:56px;display:flex;justify-content:space-between;align-items:center;z-index:3}
.clock{display:flex;align-items:baseline;gap:14px}
#time{font-size:40px;font-weight:300;line-height:1}
#date{font-size:16px;color:rgba(245,246,248,.7)}
.tabs{display:flex;gap:6px;padding:6px;border-radius:30px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.tab{height:44px;padding:0 21px;border-radius:22px;border:0;background:transparent;color:rgba(245,246,248,.8);font-size:16px;font-weight:500;transition:background .3s,color .3s,box-shadow .3s}
.tab.cur{background:#F5F6F8;color:#07080B;font-weight:600}
.tab.on{box-shadow:0 0 0 3px #FF6B4A}
.status{display:flex;align-items:center;gap:16px;color:rgba(245,246,248,.85);font-size:16px;min-width:200px;justify-content:flex-end}
#weather{display:flex;align-items:center;gap:8px}
section{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
section.show{opacity:1;visibility:visible}
#heroText{position:absolute;top:150px;right:56px;width:640px;height:250px}
.tx{position:absolute;top:0;right:0;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:12px;opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.tx.on{opacity:1;transform:none}
.chip{padding:5px 14px;border-radius:14px;font-size:14px;font-weight:600;background:rgba(255,107,74,.18);color:#FF9A80}
.chip.cool{background:rgba(94,214,207,.16);color:#8FE3F0}
.tt{font-size:46px;font-weight:700;line-height:1.1}
.ts{font-size:18px;color:rgba(245,246,248,.72)}
.actions{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:12px}
.btn{height:52px;padding:0 26px;border-radius:26px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);font-size:17px;font-weight:500;display:flex;align-items:center;gap:10px;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.btn.main{background:#F5F6F8;color:#07080B;border:0;font-weight:600}
.btn.on{transform:scale(1.06);box-shadow:0 0 0 3px #FF6B4A,0 14px 30px rgba(0,0,0,.5)}
.dots{display:flex;gap:7px;align-items:center;margin-right:18px}
.dot{height:6px;width:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .6s cubic-bezier(.2,.8,.2,1),background .6s}
.dot.on{width:30px;background:#F5F6F8}
#rowWrap{position:absolute;right:56px;left:56px;top:462px;display:flex;flex-direction:column;gap:14px}
.rowHead{display:flex;justify-content:space-between;align-items:baseline}
.rowHead b{font-size:20px;font-weight:600}
#focusName{font-size:15px;color:rgba(245,246,248,.55)}
#row{display:flex;gap:22px;padding:8px 6px 0}
.tile{width:116px;height:116px;flex:none;border-radius:26px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,#20242E,#12151B);display:flex;align-items:center;justify-content:center;opacity:.75;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s,opacity .4s}
.tile img{width:64px;height:64px;border-radius:14px}
.tile.on,.card.on .tile{opacity:1;transform:scale(1.14) translateY(-6px);box-shadow:0 0 0 3px #F5F6F8,0 24px 50px rgba(0,0,0,.7)}
.tile.all{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.star{position:absolute;margin:-80px -80px 0 0;font-size:0}
.page{position:absolute;top:118px;right:56px;left:56px;bottom:40px}
.page h2{margin:0 0 6px;font-size:30px;font-weight:700}
.page p.lead{margin:0 0 22px;color:rgba(245,246,248,.6);font-size:16px}
#grid{position:absolute;top:84px;right:0;left:0;bottom:0;overflow:hidden;padding:14px 8px 40px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:26px 18px;align-content:start}
.card{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.card .tile{width:112px;height:112px}
.card span{font-size:15px;color:rgba(245,246,248,.7);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on span{color:#fff}
.card.fav .tile{border-color:rgba(255,107,74,.6)}
.opts{display:flex;flex-direction:column;gap:14px;max-width:760px}
.opt{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);text-align:right;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s}
.opt.on{background:rgba(255,255,255,.1);transform:scale(1.02);box-shadow:0 0 0 3px #FF6B4A}
.opt svg{flex:none}
.opt b{display:block;font-size:19px;font-weight:600}
.opt small{display:block;font-size:14px;color:rgba(245,246,248,.6);margin-top:2px}
#toast{position:absolute;left:50%;bottom:54px;transform:translate(-50%,20px);padding:14px 26px;border-radius:18px;background:rgba(20,22,28,.95);border:1px solid rgba(255,255,255,.12);font-size:17px;opacity:0;transition:opacity .35s,transform .35s;z-index:9;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;bottom:16px;left:56px;right:56px;display:flex;justify-content:space-between;font-size:13px;color:rgba(245,246,248,.4);z-index:2}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div class="shade1"></div><div class="shade2"></div><div id="dim"></div>

  <header>
    <div class="clock"><div id="time"></div><div id="date"></div></div>
    <nav class="tabs">
      <button class="tab f cur" data-act="tab:home" id="tab-home">الرئيسية</button>
      <button class="tab f" data-act="tab:apps" id="tab-apps">التطبيقات</button>
      <button class="tab f" data-act="tab:settings" id="tab-settings">الإعدادات</button>
    </nav>
    <div class="status">
      <div id="weather"></div>
      <svg id="net" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>
    </div>
  </header>

  <section id="home" class="show">
    <div id="heroText">
      <div id="caps"></div>
      <div class="actions">
        <button class="btn main f" data-act="play" id="playBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 4v16L5 12z"/></svg>تشغيل</button>
        <button class="btn f" data-act="tab:apps">كل التطبيقات</button>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <div id="rowWrap">
      <div class="rowHead"><b>تطبيقاتك</b><span id="focusName"></span></div>
      <div id="row"></div>
    </div>
  </section>

  <section id="apps">
    <div class="page">
      <h2>كل التطبيقات</h2>
      <p class="lead">اضغط OK للفتح · اضغط مطوّلاً حتى تضيف التطبيق للشاشة الرئيسية أو تشيله</p>
      <div id="grid"></div>
    </div>
  </section>

  <section id="settings">
    <div class="page">
      <h2>الإعدادات</h2>
      <p class="lead">لتغيير صور البنر: سوّي مجلد اسمه Banner بالفلاشة، حط بيه لحد ٤ صور، وبعدين اضغط استيراد</p>
      <div class="opts">
        <button class="opt f" data-act="import"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FF9A80" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span><b>استيراد صور البنر من الفلاشة</b><small>ياخذ أول ٤ صور من مجلد Banner وينسخها للتطبيق</small></span></button>
        <button class="opt f" data-act="clear"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#8FE3F0" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span><b>رجّع الصور الافتراضية</b><small>يمسح صورك ويرجّع المشاهد الأصلية</small></span></button>
        <button class="opt f" data-act="homeset"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#C79BFF" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span><b>خلّيه الواجهة الرئيسية</b><small>يفتح إعداد التطبيق الرئيسي بالتلفاز</small></span></button>
        <button class="opt f" data-act="tvset"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B9C2D3" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span><b>إعدادات التلفاز</b><small>الشبكة، الصوت، الشاشة وغيرها</small></span></button>
      </div>
    </div>
  </section>

  <div class="hint"><span id="hintL">الأسهم للتنقل · OK للفتح · مطوّلاً لإضافة أو إزالة تطبيق</span><span>شاشتي ١.٠</span></div>
  <div id="toast"></div>
</div>

<script>
{
const TV = window.TV || null;
const $ = (s) => document.querySelector(s);
const AR = (s) => String(s).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- fit the 1280x720 stage to any TV ---------- */
const stage = $('#stage');
function fit() {
  const s = Math.min(innerWidth / 1280, innerHeight / 720);
  stage.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();

/* ---------- clock & date ---------- */
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
function tick() {
  const d = new Date();
  let h = d.getHours() % 12; if (h === 0) h = 12;
  $('#time').textContent = AR(h + ':' + String(d.getMinutes()).padStart(2, '0'));
  $('#date').textContent = DAYS[d.getDay()] + ' ' + AR(d.getDate()) + ' ' + MONTHS[d.getMonth()];
  $('#net').style.opacity = navigator.onLine ? 1 : .3;
}
setInterval(tick, 10000); tick();

/* ---------- weather (Samawah, free, no key) ---------- */
const SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFC36B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const CLOUD = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B9C2D3" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z"/></svg>';
function weather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=31.31&longitude=45.28&current=temperature_2m,weather_code')
    .then((r) => r.json())
    .then((j) => {
      const t = Math.round(j.current.temperature_2m), c = j.current.weather_code;
      $('#weather').innerHTML = (c <= 1 ? SUN : CLOUD) + '<span></span>';
      $('#weather span').textContent = AR(t) + '° السماوة';
    }).catch(() => {});
}
weather(); setInterval(weather, 30 * 60 * 1000);

/* ---------- banner slides ---------- */
const SCENES = [
'<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070C22"/><stop offset=".7" stop-color="#2B1C4E"/><stop offset="1" stop-color="#4A2A55"/></linearGradient></defs><rect width="1280" height="720" fill="url(#a1)"/><g fill="#fff" opacity=".75"><circle cx="120" cy="80" r="1.6"/><circle cx="260" cy="150" r="1.2"/><circle cx="380" cy="60" r="1.4"/><circle cx="520" cy="120" r="1"/><circle cx="640" cy="50" r="1.6"/><circle cx="760" cy="110" r="1.1"/></g><circle cx="300" cy="190" r="62" fill="#F6ECD6"/><circle cx="300" cy="190" r="110" fill="#F6ECD6" opacity=".07"/><g fill="#120F2A"><rect x="0" y="380" width="90" height="340"/><rect x="100" y="320" width="70" height="400"/><rect x="180" y="410" width="110" height="310"/><rect x="300" y="270" width="64" height="450"/><rect x="374" y="350" width="120" height="370"/><rect x="504" y="400" width="80" height="320"/><rect x="594" y="330" width="96" height="390"/><rect x="700" y="420" width="130" height="300"/><rect x="840" y="380" width="80" height="340"/><rect x="930" y="440" width="140" height="280"/></g><g fill="#FFC36B" opacity=".85"><rect x="118" y="350" width="8" height="11"/><rect x="142" y="400" width="8" height="11"/><rect x="316" y="300" width="8" height="11"/><rect x="340" y="380" width="8" height="11"/><rect x="396" y="390" width="8" height="11"/><rect x="450" y="440" width="8" height="11"/><rect x="612" y="360" width="8" height="11"/><rect x="650" y="420" width="8" height="11"/><rect x="24" y="420" width="8" height="11"/><rect x="720" y="460" width="8" height="11"/></g></svg>',
'<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241A40"/><stop offset=".55" stop-color="#B9503E"/><stop offset=".8" stop-color="#F2A15E"/></linearGradient></defs><rect width="1280" height="720" fill="url(#a2)"/><circle cx="380" cy="430" r="110" fill="#FFD08A" opacity=".92"/><circle cx="380" cy="430" r="200" fill="#FFD08A" opacity=".1"/><path d="M0 470 L200 430 L420 460 L680 420 L980 455 L1280 430 V720 H0Z" fill="#3A1F26"/><path d="M0 530 L300 505 L640 535 L1000 510 L1280 530 V720 H0Z" fill="#170C11"/><g fill="#170C11"><rect x="196" y="330" width="11" height="200"/><path d="M201 330c-50 10-62 30-68 42c26-13 48-20 68-26zM201 330c50 10 62 30 68 42c-26-13-48-20-68-26zM201 327c-16-26-36-36-52-40c20 16 36 30 52 46zM201 327c16-26 36-36 52-40c-20 16-36 30-52 46z"/><rect x="640" y="380" width="9" height="150"/><path d="M644 380c-40 8-50 24-55 34c21-10 39-16 55-21zM644 380c40 8 50 24 55 34c-21-10-39-16-55-21zM644 378c-13-20-29-29-42-32c16 13 29 24 42 37zM644 378c13-20 29-29 42-32c-16 13-29 24-42 37z"/></g></svg>',
'<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2C46"/><stop offset=".6" stop-color="#4FA3BC"/><stop offset="1" stop-color="#9AD7DE"/></linearGradient></defs><rect width="1280" height="720" fill="url(#a3)"/><circle cx="420" cy="200" r="70" fill="#FFF4DA" opacity=".9"/><path d="M0 400 Q110 370 220 400 T440 400 T660 400 T880 400 T1100 400 T1320 400 V720 H0Z" fill="#1F6E8C"/><path d="M0 470 Q120 440 240 470 T480 470 T720 470 T960 470 T1200 470 T1440 470 V720 H0Z" fill="#165A75"/><path d="M0 550 Q130 520 260 550 T520 550 T780 550 T1040 550 T1300 550 V720 H0Z" fill="#0C3A50"/></svg>',
'<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="a4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040E12"/><stop offset="1" stop-color="#0F3536"/></linearGradient><linearGradient id="au" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ED6CF" stop-opacity="0"/><stop offset=".45" stop-color="#5ED6CF" stop-opacity=".6"/><stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/></linearGradient></defs><rect width="1280" height="720" fill="url(#a4)"/><path d="M0 220 C220 90 420 330 660 180 S1000 110 1280 240 L1280 330 C1000 220 840 380 660 300 S240 200 0 330Z" fill="url(#au)"/><path d="M0 520 L160 360 L290 470 L420 330 L560 450 L700 340 L860 470 L1020 380 L1280 490 V720 H0Z" fill="#0A1F22"/><path d="M0 600 L240 545 L500 590 L820 550 L1280 590 V720 H0Z" fill="#040A0C"/></svg>'
];
let banner = [];
let slide = 0, slideTimer = null;
function greet() { const h = new Date().getHours(); return h < 12 ? 'صباح الخير' : 'مساء الخير'; }
function captions() {
  const last = store.get('last', null);
  const custom = banner.length > 0;
  return [
    { chip: 'سهرة الليلة', t: 'أفلام ومسلسلات بدقة عالية', s: 'كل تطبيقات المشاهدة بمكان واحد', c: '' },
    { chip: greet(), t: 'شنو تريد تشوف اليوم؟', s: last ? 'آخر تطبيق فتحته: ' + last.label : 'اختار تطبيق من تحت', c: '' },
    { chip: 'وقت الراحة', t: 'موسيقى هادئة للبيت', s: 'شغّلها بضغطة وحدة من الريموت', c: 'cool' },
    custom ? { chip: 'خلفياتك', t: 'صورك على الشاشة', s: 'تكدر تغيّرها من الإعدادات', c: 'cool' }
           : { chip: 'خلفياتك', t: 'حط صورك بالبنر', s: 'الإعدادات ← استيراد صور البنر', c: 'cool' }
  ];
}
function renderSlides() {
  const n = banner.length ? banner.length : 4;
  $('#slides').innerHTML = Array.from({ length: n }, (_, i) =>
    '<div class="sl">' + (banner.length ? '<img alt="" src="' + esc(banner[i]) + '">' : SCENES[i]) + '</div>').join('');
  $('#dots').innerHTML = Array.from({ length: n }, () => '<span class="dot"></span>').join('');
  slide = 0; showSlide();
  clearInterval(slideTimer);
  if (n > 1) slideTimer = setInterval(() => { slide = (slide + 1) % n; showSlide(); }, 5000);
}
function showSlide() {
  const caps = captions();
  $('#caps').innerHTML = caps.map((c) =>
    '<div class="tx"><span class="chip ' + c.c + '">' + esc(c.chip) + '</span><div class="tt">' + esc(c.t) + '</div><div class="ts">' + esc(c.s) + '</div></div>').join('');
  document.querySelectorAll('.sl').forEach((e, i) => e.classList.toggle('on', i === slide));
  document.querySelectorAll('.dot').forEach((e, i) => e.classList.toggle('on', i === slide));
  const txs = document.querySelectorAll('.tx');
  requestAnimationFrame(() => { const t = txs[slide % txs.length]; if (t) t.classList.add('on'); });
}

/* ---------- apps ---------- */
let apps = [];
const PREFER = ['com.google.android.youtube.tv','com.google.android.youtube','com.netflix.ninja','com.amazon.amazonvideo.livingroom','com.spotify.tv.android','com.android.chrome','com.google.android.videos','com.android.vending'];
function favs() {
  let f = store.get('favs', null);
  if (!f) {
    const sorted = apps.slice().sort((a, b) => {
      const ia = PREFER.indexOf(a.pkg), ib = PREFER.indexOf(b.pkg);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    f = sorted.slice(0, 7).map((a) => a.pkg);
  }
  return f.map((p) => apps.find((a) => a.pkg === p)).filter(Boolean).slice(0, 7);
}
const ALL_ICON = '<svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="18" cy="6" r="1.8"/><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/><circle cx="6" cy="18" r="1.8"/><circle cx="12" cy="18" r="1.8"/><circle cx="18" cy="18" r="1.8"/></svg>';
function renderRow() {
  const keep = focusEl && focusEl.closest('#row') ? [...$('#row').children].indexOf(focusEl) : -1;
  $('#row').innerHTML = favs().map((a) =>
    '<button class="tile f" data-act="launch:' + esc(a.pkg) + '" data-name="' + esc(a.label) + '"><img alt="" src="' + a.icon + '"></button>').join('') +
    '<button class="tile all f" data-act="tab:apps" data-name="كل التطبيقات">' + ALL_ICON + '</button>';
  bind($('#row'));
  if (keep >= 0) setFocus($('#row').children[Math.min(keep, $('#row').children.length - 1)]);
}
function renderGrid() {
  const fp = favs().map((a) => a.pkg);
  $('#grid').innerHTML = apps.map((a) =>
    '<button class="card f' + (fp.includes(a.pkg) ? ' fav' : '') + '" data-act="launch:' + esc(a.pkg) + '" data-name="' + esc(a.label) + '"><div class="tile"><img alt="" src="' + a.icon + '"></div><span>' + esc(a.label) + '</span></button>').join('');
  bind($('#grid'));
}
function toggleFav(pkg) {
  let f = favs().map((a) => a.pkg);
  const app = apps.find((a) => a.pkg === pkg);
  if (!app) return;
  if (f.includes(pkg)) { f = f.filter((p) => p !== pkg); toast('انشال ' + app.label + ' من الرئيسية'); }
  else {
    if (f.length >= 7) { toast('الرئيسية بيها ٧ تطبيقات، شيل واحد أول'); return; }
    f.push(pkg); toast('انضاف ' + app.label + ' للرئيسية');
  }
  store.set('favs', f);
  renderRow(); renderGrid();
}
function launch(pkg) {
  const app = apps.find((a) => a.pkg === pkg);
  if (app) store.set('last', { pkg: app.pkg, label: app.label });
  if (TV) TV.launch(pkg);
}

/* ---------- screens ---------- */
let screen = 'home';
function show(name) {
  screen = name;
  document.querySelectorAll('section').forEach((s) => s.classList.toggle('show', s.id === name));
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('cur', t.id === 'tab-' + name));
  stage.classList.toggle('sub', name !== 'home');
  const first = name === 'home' ? ($('#row .f') || $('#playBtn')) : $('#' + name + ' .f');
  setFocus(first || $('#tab-' + name));
  if (name === 'apps') $('#grid').scrollTop = 0;
}

/* ---------- remote-control navigation ---------- */
let focusEl = null;
function setFocus(el) {
  if (!el) return;
  if (focusEl) focusEl.classList.remove('on');
  focusEl = el; el.classList.add('on');
  if (el.dataset.name && el.closest('#row')) $('#focusName').textContent = el.dataset.name;
  if (el.closest('#grid')) {
    const g = $('#grid'), top = el.offsetTop - g.clientHeight / 2 + el.offsetHeight / 2;
    g.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}
function candidates() { return [...document.querySelectorAll('header .f, #' + screen + ' .f')]; }
function move(dir) {
  if (!focusEl) { setFocus(candidates()[0]); return; }
  const r = focusEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let best = null, bs = Infinity;
  for (const el of candidates()) {
    if (el === focusEl) continue;
    const q = el.getBoundingClientRect(); if (!q.width) continue;
    const dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
    let main, cross;
    if (dir === 'left')  { if (dx > -8) continue; main = -dx; cross = Math.abs(dy) * 4; }
    if (dir === 'right') { if (dx < 8)  continue; main = dx;  cross = Math.abs(dy) * 4; }
    if (dir === 'up')    { if (dy > -8) continue; main = -dy; cross = Math.abs(dx); }
    if (dir === 'down')  { if (dy < 8)  continue; main = dy;  cross = Math.abs(dx); }
    if (main + cross < bs) { bs = main + cross; best = el; }
  }
  if (best) setFocus(best);
}
function activate(el, long) {
  const a = el.dataset.act || '';
  if (a.startsWith('launch:')) { long ? toggleFav(a.slice(7)) : launch(a.slice(7)); return; }
  if (long) return;
  if (a.startsWith('tab:')) show(a.slice(4));
  else if (a === 'play') {
    const last = store.get('last', null), f = favs()[0];
    const pkg = last ? last.pkg : f ? f.pkg : null;
    pkg ? launch(pkg) : show('apps');
  }
  else if (a === 'import') { toast('جاري البحث عن مجلد Banner…'); if (TV) TV.importBanner(); }
  else if (a === 'clear') { if (TV) TV.clearBanner(); banner = []; renderSlides(); toast('رجعت الصور الافتراضية'); }
  else if (a === 'homeset') { if (TV) TV.openHomeSettings(); }
  else if (a === 'tvset') { if (TV) TV.openSettings(); }
}
function bind(root) {
  root.querySelectorAll('.f').forEach((el) => {
    el.onclick = () => { setFocus(el); activate(el, false); };
  });
}
let longDone = false, downAt = 0;
const OK = (e) => e.key === 'Enter' || e.keyCode === 13 || e.keyCode === 23;
addEventListener('keydown', (e) => {
  const m = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (m) { e.preventDefault(); move(m); return; }
  if (OK(e)) {
    e.preventDefault();
    if (!e.repeat) { downAt = Date.now(); longDone = false; }
    else if (!longDone && Date.now() - downAt > 600 && focusEl) { longDone = true; activate(focusEl, true); }
  }
});
addEventListener('keyup', (e) => {
  if (OK(e)) { e.preventDefault(); if (!longDone && focusEl) activate(focusEl, false); longDone = false; }
});

/* ---------- toast ---------- */
let toastT = null;
window.toast = (msg) => {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
};

/* ---------- called from Android ---------- */
window.onApps = (json) => { try { apps = JSON.parse(json); } catch (e) { apps = []; } renderRow(); renderGrid(); if (!focusEl || !document.contains(focusEl)) show(screen); };
window.onBanner = (json) => { try { banner = JSON.parse(json); } catch (e) { banner = []; } renderSlides(); };
window.refreshApps = () => { if (TV) TV.getApps(); };
window.tvBack = () => { if (screen !== 'home') show('home'); };

/* ---------- start ---------- */
bind(document);
try { banner = TV ? JSON.parse(TV.getBanner()) : []; } catch (e) { banner = []; }
renderSlides();
renderRow();
show('home');
if (TV) TV.getApps();
}
</script>
</body>
</html>
